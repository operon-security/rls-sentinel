name: fixture
on:
  push:
  pull_request:
jobs:
  real-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Load planted leaks
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f test/fixture.sql
      - name: Scan
        run: node dist/index.js --url "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable" --format json --out report.json
      - name: Terminal report (for the log)
        run: node dist/index.js --url "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable" || true
      - name: Assert known answer
        run: node test/expect.js report.json
